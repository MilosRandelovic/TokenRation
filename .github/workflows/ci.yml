name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build (debug)
        run: swift build
      - name: Test
        run: swift test
      - name: Assemble .app bundle (release, ad-hoc signed)
        run: bash build-app.sh
