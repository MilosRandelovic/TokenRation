name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-lint-test:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Check formatting
      run: make lint

    - name: Build and run tests
      run: make test

    - name: Assemble app bundle
      run: make app
